<script>
/*PURE-START*/
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let OCULTA = false;   /* modo privacidade: esconde os valores na tela (não afeta a planilha exportada) */
const brl = v => OCULTA ? 'R$ ••••••' : BRL.format(v);
const mesLabel = id => MESES[+id.slice(5,7)-1] + '/' + id.slice(2,4);
const mesPrev = id => { let y=+id.slice(0,4), m=+id.slice(5,7)-1; if(m===0){m=12;y--;} return y+'-'+String(m).padStart(2,'0'); };
const SEM = 'Sem categoria';
function aplicaRegra(desc, lista){
  const u = String(desc).toUpperCase();
  for (const r of lista) if (r.p && u.includes(String(r.p).toUpperCase())) return r.k;
  return '';
}
const COFRE = 'Aplicação - Cofrinho', REND = 'Investimentos/Rendimentos';
const TIPOS = ['Receita','Despesa','Estorno (abate despesa)','Aplicação','Resgate','Fora do resultado'];
/* só Despesa e Estorno entram no cálculo das despesas */
const entraDespesa = t => t==='Despesa' || t==='Estorno (abate despesa)';
function tipoDe(r, out){
  const t = r.tp;
  /* o cofrinho segue sempre a regra de investimento; um tipo gravado como Receita/Despesa não vale para ele */
  if (r.k===COFRE && t!=='Fora do resultado') return r.v<0 ? 'Aplicação' : 'Resgate';
  if (t==='Receita' || t==='Fora do resultado') return t;
  if (t==='Despesa' || t==='Estorno (abate despesa)') return r.v<0 ? 'Despesa' : 'Estorno (abate despesa)';
  if (t==='Aplicação' || t==='Resgate') return r.v<0 ? 'Aplicação' : 'Resgate';
  if (r.k==='Salário' && r.v>0) return 'Receita';
  if (r.k===COFRE) return r.v<0 ? 'Aplicação' : 'Resgate';
  if (r.k && out.has(r.k)) return 'Fora do resultado';
  return r.v<0 ? 'Despesa' : 'Estorno (abate despesa)';
}
function calcMes(rows, fora){
  const out = new Set(fora), net = {};
  for (const r of rows){
    const t = tipoDe(r, out);
    if (!entraDespesa(t)) continue;
    const key = r.c+'|'+(r.k||SEM);
    net[key] = (net[key]||0) + r.v;
  }
  const byCat = {}; let gasto = 0;
  for (const [key,v] of Object.entries(net)){
    if (v < 0){ const cat = key.split('|')[1]; byCat[cat] = (byCat[cat]||0) - v; gasto -= v; }
  }
  return { gasto, byCat };
}
function salarioComp(id, meses, geral){
  const out = new Set(geral.fora||[]);
  const prev = meses[mesPrev(id)];
  let base = null;
  if (prev){ const s = prev.rows.filter(r=>r.k==='Salário' && r.v>0 && tipoDe(r,out)==='Receita').reduce((a,r)=>a+r.v,0); if (s>0) base = s; }
  if (base==null) base = (geral.salariosManual||{})[id] ?? null;
  const cur = meses[id];
  const extra = cur ? cur.rows.filter(r=>r.k!=='Salário' && r.v>0 && tipoDe(r,out)==='Receita').reduce((a,r)=>a+r.v,0) : 0;
  return base==null && !extra ? null : (base||0) + extra;
}
function sugerePadrao(desc){
  return String(desc).toUpperCase().replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?$/,'').replace(/\d{2}\/\d{2}$/,'')
    .replace(/^(PIX (QRS|TRANSF)|RSCSS|RSHOP|PAGAMENTO COM (QR PIX|PIX|CÓDIGO QR)|PIX ENVIADO)[\s-]*/,'').replace(/[\d\-\s]+$/,'').trim().slice(0,28);
}
function parseItau(aoa){
  const out = [];
  for (const row of aoa){
    const d = String(row[0]??'').trim(), t = String(row[1]??'').trim(), v = row[3];
    const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m || typeof v !== 'number' || !t || /^SALDO/i.test(t)) continue;
    out.push({ c:'Itaú', d:`${m[3]}-${m[2]}-${m[1]}`, t, v:Math.round(v*100)/100 });
  }
  return out;
}
function dedupe(novos, existentes){
  const cnt = {}; for (const r of existentes){ const k=[r.c,r.d,r.t,r.v].join('|'); cnt[k]=(cnt[k]||0)+1; }
  const seen = {}, add = [], dup = [];
  for (const r of novos){ const k=[r.c,r.d,r.t,r.v].join('|'); seen[k]=(seen[k]||0)+1; (seen[k] <= (cnt[k]||0) ? dup : add).push(r); }
  return { add, dup };
}

const DELIV = /IFOOD|SUSHI|PASTEL|ARCOS|SANTA BRASA|ISALCO|BAR E REST|BRASA GRILL|MINEIRO|PIZZARIA|MC DONALD/i;
const PLANO_PADRAO = {
  salario: 5161, semUber: true, googleSai: 24.99,
  parcelas: [{ nome:'Salva Daniel e Samantha', valor:188.5, de:'2026-10', ate:'2027-01' }],
  deliveryPct: 50, pingosPct: 25, contas: 104.1, reembolso: 0, inicio: '2026-10', meses: 12
};
function baseMes(rows, fora){
  const out = new Set(fora), { gasto, byCat } = calcMes(rows, fora);
  let delivery = 0, pingos = 0;
  for (const r of rows){
    if (r.v >= 0 || !entraDespesa(tipoDe(r,out))) continue;
    if (DELIV.test(r.t)) delivery -= r.v;
    else if (r.v > -30 && r.k !== 'Uber' && r.k !== 'Assinaturas') pingos -= r.v;
  }
  return { gasto, uber: byCat['Uber']||0, delivery, pingos };
}
function mesSoma(id, n){ let y=+id.slice(0,4), m=+id.slice(5,7)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); }
function projeta(p, b){
  const cortes = b.delivery*p.deliveryPct/100 + b.pingos*p.pingosPct/100 + p.contas;
  const gastoBase = b.gasto - (p.semUber ? b.uber : 0) - p.googleSai;
  const linhas = []; let acum = 0;
  for (let i=0;i<p.meses;i++){
    const id = mesSoma(p.inicio, i);
    const parc = p.parcelas.reduce((a,x)=> a + (id>=x.de && id<=x.ate ? x.valor : 0), 0);
    const res = p.salario - gastoBase - parc + cortes + p.reembolso;
    acum += res;
    linhas.push({ id, salario:p.salario, gastoBase, parc, cortes, reembolso:p.reembolso, res, acum });
  }
  return { linhas, cortes, gastoBase };
}
/* ---------- investimentos: aplicação baixa o saldo em conta, resgate aumenta; nada disso é despesa nem receita ---------- */
function investe(meses, geral){
  const out = new Set(geral.fora||[]), ini = geral.invIni||{};
  const idsM = Object.keys(meses).sort(), porConta = {}, linhas = [];
  const cc = c => (porConta[c] ||= { aplic:0, resg:0, rend:0, ini:Number(ini[c])||0 });
  for (const c of Object.keys(ini)) cc(c);
  let saldo = Object.values(ini).reduce((a,x)=>a+(Number(x)||0),0), rendAc = 0;
  for (const id of idsM){
    let aplic = 0, resg = 0, rend = 0;
    for (const r of meses[id].rows){
      const t = tipoDe(r, out);
      if (t==='Aplicação'){ aplic -= r.v; cc(r.c).aplic -= r.v; }
      else if (t==='Resgate'){ resg += r.v; cc(r.c).resg += r.v; }
      else if (r.k===REND && r.v>0){ rend += r.v; cc(r.c).rend += r.v; }
    }
    saldo += aplic - resg; rendAc += rend;
    linhas.push({ id, aplic, resg, rend, liq:aplic-resg, saldo, rendAc, efeito:resg-aplic });
  }
  for (const o of Object.values(porConta)) o.saldo = o.ini + o.aplic - o.resg;
  return { linhas, porConta, saldo, rendAc };
}

function parseRelatorio(aoa){
  const hi = aoa.findIndex(r=>r && ['Data','Conta','Descrição','Valor','Categoria'].every(c=>r.includes(c)));
  if (hi<0) return null;
  const H = aoa[hi], ix = n=>H.indexOf(n);
  const dt = x=>{ if (x instanceof Date && !isNaN(x)){ const y = new Date(x.getTime()+12*3600e3); return y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0'); }
    if (typeof x==='string'){ const m=x.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); const q=x.trim().match(/^(\d{4})-(\d{2})-(\d{2})/); if (q) return q[0]; } return null; };
  const out = [];
  for (const row of aoa.slice(hi+1)){
    if (!row) continue;
    const d = dt(row[ix('Data')]), t = String(row[ix('Descrição')]??'').trim();
    let v = row[ix('Valor')]; if (typeof v==='string') v = Number(v.replace(/R\$|\s/g,'').replace(/\./g,'').replace(',','.'));
    if (!d || !t || typeof v!=='number' || !isFinite(v)) continue;
    let k = String(row[ix('Categoria')]??'').trim(); if (k===SEM) k = '';
    const tpRaw = ix('Tipo')>=0 ? String(row[ix('Tipo')]??'').trim() : '';
    const tp = TIPOS.find(x=>x.toLowerCase()===tpRaw.toLowerCase()) || (/^estorno/i.test(tpRaw)?'Estorno (abate despesa)':/^fora/i.test(tpRaw)?'Fora do resultado':/^aplica/i.test(tpRaw)?'Aplicação':/^resgate/i.test(tpRaw)?'Resgate':'');
    out.push({ c:String(row[ix('Conta')]??'').trim(), d, t, v:Math.round(v*100)/100, k, tp });
  }
  return out.length ? out : null;
}

function lerGenerico(aoa, conta){
  const out = [];
  const iso = x=>{ if (x instanceof Date && !isNaN(x)) return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
    if (typeof x==='string'){ const m=x.trim().match(/^(\d{2})\/(\d{2})\/(\d{2,4})$/); if(m) return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2]+'-'+m[1]; const q=x.trim().match(/^(\d{4})-(\d{2})-(\d{2})/); if(q) return q[0].slice(0,10); } return null; };
  const num = x=>{ if (typeof x==='number'&&isFinite(x)) return x; if (typeof x==='string'){ const t=x.replace(/R\$|\s/g,''); if(!/^-?[\d.]*,?\d+$/.test(t)&&!/^-?\d+(\.\d+)?$/.test(t)) return null; const n=t.includes(',')?Number(t.replace(/\./g,'').replace(',','.')):Number(t); return isFinite(n)?n:null; } return null; };
  for (const row of aoa){
    let di=-1, d=null;
    for (let i=0;i<Math.min(row.length,4);i++){ d=iso(row[i]); if(d){di=i;break;} }
    if (!d) continue;
    let desc='', val=null;
    for (let i=di+1;i<row.length;i++){ const c=row[i];
      if (!desc && typeof c==='string' && c.trim() && num(c)===null){ desc=c.trim(); continue; }
      if (desc && val===null){ const n=num(c); if (n!==null){ val=n; break; } } }
    if (!desc || val===null || /saldo/i.test(desc)) continue;
    out.push({ c:conta, d, t:desc, v:Math.round(val*100)/100 });
  }
  return out;
}

    XLSX.utils.book_append_sheet(wb,w3,'Lançamentos');

    const iv = [['Mês','Aplicações (baixam o saldo)','Resgates (aumentam o saldo)','Líquido aplicado','Rendimentos','Efeito no saldo em conta','Saldo investido']];
    IV.linhas.forEach(x=>iv.push([mesLabel(x.id), r2(x.aplic), r2(x.resg), r2(x.liq), r2(x.rend), r2(x.efeito), r2(x.saldo)]));
    const w4 = XLSX.utils.aoa_to_sheet(iv); w4['!cols']=[{wch:14},{wch:26},{wch:26},{wch:16},{wch:14},{wch:24},{wch:16}];
    XLSX.utils.book_append_sheet(wb,w4,'Investimentos');
    const buf = XLSX.write(wb,{type:'array',bookType:'xlsx'});
    await dl.save({ filename:'meu-caixa-relatorio-'+sel+'.xlsx', data:new Uint8Array(buf) });
    toast('Relatório gerado.');
  }catch(e){ if (!e || e.code!=='declined') toast('Não foi possível exportar: '+((e&&e.message)||e)); }
}
const r2 = x => Math.round(x*100)/100;
$('exp').prepend(svg(IC.down)); $('exp').addEventListener('click', exportar);

carregar().catch(e=>{ $('sub').textContent='Erro ao carregar: '+(e&&e.message||e); });
</script>
